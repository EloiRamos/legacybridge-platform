id: T09
class: inventory_interpretation
user: daniel
prompt: How much BW-1004 can we ship, per backend?
baseline: stock BW-1004
oracle:
  type: stock
  sku: BW-1004
  backends:
  - halden
  - skarvik
tools_any:
- explain_stock_discrepancy
- get_availability
scripted:
- tool_calls:
  - call_id: c1
    name: explain_stock_discrepancy
    arguments:
      canonical_sku: BW-1004
- final:
    summary: BW-1004 per backend; never summed across legal entities.
    draft_operation_id: null
    warnings: []
    next_human_actions:
    - check_inventory
    facts:
    - value: IN_STOCK
      source:
        tool_call_id: c1
        field_path: per_backend[0].status
    - value: '19'
      source:
        tool_call_id: c1
        field_path: per_backend[0].available_base
    - value: OUT_OF_STOCK
      source:
        tool_call_id: c1
        field_path: per_backend[1].status
    - value: '0'
      source:
        tool_call_id: c1
        field_path: per_backend[1].available_base
