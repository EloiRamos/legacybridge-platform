[project]
name = "lbf"
version = "2.0.0"
description = "LEGACYBRIDGE Platform: durable, auditable order operations over two simulated legacy ERPs (fictional engagement)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "httpx==0.28.1",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "defusedxml==0.7.1",
    "prometheus-client==0.26.0",
    "openai==3.57.0",
]

[project.scripts]
lbf-admin = "lbf.cli.admin:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "hypothesis==6.170.17",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "types-defusedxml==0.7.0.20260504",
    "pyyaml==6.0.4",
]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lbf"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "live: requires running simulators (docker compose --profile test)",
    "db: requires the PostgreSQL test database (docker compose --profile test up -d db)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/lbf/adapters/halden/v1bridge"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "B017"]

[tool.mypy]
python_version = "3.12"
files = ["src/lbf/domain", "src/lbf/ports", "src/lbf/workflow/permissions.py", "src/lbf/auth/policy.py"]
strict = true
plugins = ["pydantic.mypy"]
follow_imports = "silent"
