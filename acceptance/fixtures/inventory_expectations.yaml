  # inventory_max_age_seconds, every SKARVIK item is STALE with available_base null.
  rule: {status: STALE, available_base: null}
cross_backend:
  # I-3: never summed. BW-1001 shows HALDEN 300 and SKARVIK 120 as separate rows.
  - {canonical_sku: BW-1001, rows: [{backend_id: halden, available_base: 300}, {backend_id: skarvik, available_base: 120}]}
