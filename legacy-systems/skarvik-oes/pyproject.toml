[project]
name = "skarvik"
version = "4.0.0"
description = "SKARVIK OES 4 — simulator of a fictional Nordic order-exchange system (file-drop exchange skarvik-exchange/1.0)."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
